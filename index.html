<!DOCTYPE html>
<html>
<head>
    <title>Serverless Task Reminder</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 400px; }
        input, button { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Add a Task</h2>
    <form id="taskForm">
        <label>Task Name:</label>
        <input type="text" id="task_name" placeholder="e.g., Renew Insurance" required>
        
        <label>Due Date:</label>
        <input type="date" id="due_date" value="2026-08-20" required>
        
        <button type="submit">Save Task</button>
    </form>
    <p id="status"></p>

    <script>
        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusLabel = document.getElementById('status');
            statusLabel.innerText = "Saving...";
            
            const data = {
                task_name: document.getElementById('task_name').value,
                due_date: document.getElementById('due_date').value
            };

            try {
                // Your exact API Gateway URL
                const response = await fetch("https://volgt0di4h.execute-api.ap-south-1.amazonaws.com/tasks", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    statusLabel.innerText = "Task saved securely!";
                    document.getElementById('taskForm').reset();
                } else {
                    statusLabel.innerText = "Error saving task.";
                }
            } catch (err) {
                statusLabel.innerText = "Connection error.";
            }
        });
    </script>
</body>
</html>
