<!DOCTYPE html>
<html>
<head>
    <title>Serverless Task Reminder</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        input, button { padding: 10px; margin-top: 5px; margin-bottom: 15px; }
        .full-width { width: 100%; box-sizing: border-box; }
        .btn-primary { background-color: #007bff; color: white; border: none; cursor: pointer; width: 100%; }
        .task-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .btn-complete { background-color: #28a745; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 3px; }
    </style>
</head>
<body>
    <!-- The title now has an ID and prevents text highlighting when double-clicked -->
    <h2 id="secretTitle" style="user-select: none;">Add a Task</h2>
    
    <form id="taskForm">
        <label>Task Name:</label>
        <input type="text" id="task_name" class="full-width" required>
        
        <label>Due Date:</label>
        <input type="date" id="due_date" class="full-width" required>
        
        <label>Email to which reminder will be sent:</label>
        <input type="email" id="user_email" class="full-width" required>

        <button type="submit" class="btn-primary">Save Task</button>
    </form>
    <p id="status"></p>

    <!-- This entire section is hidden by default -->
    <div id="hiddenTaskSection" style="display: none;">
        <h2>My Tasks</h2>
        <div id="taskList">Loading tasks...</div>
    </div>

    <script>
        //add your API endpoint URL here
        const API_URL = "https://lc3bg51n1f.execute-api.ap-south-1.amazonaws.com/tasks"; 

        // 1. Fetch and display tasks
        async function loadTasks() {
            const taskList = document.getElementById('taskList');
            try {
                const response = await fetch(API_URL);
                const tasks = await response.json();
                
                taskList.innerHTML = "";
                if(tasks.length === 0) {
                    taskList.innerHTML = "<p>No tasks right now!</p>";
                    return;
                }

                tasks.forEach(task => {
                    const div = document.createElement('div');
                    div.className = 'task-card';
                    div.innerHTML = `
                        <div>
                            <strong>${task.task_name}</strong><br>
                            <small>Due: ${task.due_date}</small>
                        </div>
                        <button class="btn-complete" onclick="deleteTask('${task.task_id}')">Mark as Complete</button>
                    `;
                    taskList.appendChild(div);
                });
            } catch (err) {
                taskList.innerHTML = "<p>Error loading tasks.</p>";
            }
        }

        // 2. Add a new task
        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('status').innerText = "Saving...";
            
            const data = {
                task_name: document.getElementById('task_name').value,
                due_date: document.getElementById('due_date').value,
                user_email: document.getElementById('user_email').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    document.getElementById('status').innerText = "Task saved!";
                    document.getElementById('taskForm').reset();
                    loadTasks(); // Updates the hidden list in the background
                }
            } catch (err) {
                document.getElementById('status').innerText = "Connection error.";
            }
        });

        // 3. Delete a task
        async function deleteTask(taskId) {
            try {
                const response = await fetch(`${API_URL}/${taskId}`, {
                    method: "DELETE"
                });
                if (response.ok) {
                    loadTasks(); // Reload the list
                }
            } catch (err) {
                alert("Failed to delete task.");
            }
        }

        // 4. Secret mobile-friendly double-tap trigger
    let tapCount = 0;
    let tapTimer;

    document.getElementById('secretTitle').addEventListener('click', (e) => {
        tapCount++;
        
        if (tapCount === 1) {
            // Start a timer. If they don't tap again within 400ms, reset the count.
            tapTimer = setTimeout(() => {
                tapCount = 0;
            }, 600);
        } else if (tapCount === 2) {
            // Double tap registered! Clear timer and toggle the section.
            clearTimeout(tapTimer);
            tapCount = 0;
            
            const taskSection = document.getElementById('hiddenTaskSection');
            if (taskSection.style.display === 'none') {
                taskSection.style.display = 'block';
                loadTasks(); 
            } else {
                taskSection.style.display = 'none'; 
            }
        }
    });
    </script>
</body>
</html>
